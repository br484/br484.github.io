# ──────────────────────────────────────────────────────────────
#  0xbr484 — terminal theme config
# ──────────────────────────────────────────────────────────────

# Site identity
title: "0xbr484"
tagline: "infosec · bug bounty · offensive research"
description: "Random offensive security notes."
author: br484
shell_host: localhost
lang: en
timezone: America/Sao_Paulo

# URL (no trailing slash on url; empty baseurl for user pages)
url: "https://br484.github.io"
baseurl: ""

# Social / identity (single source of truth — used in templates + SEO)
github_user: br484
telegram: br484
avatar: /assets/images/avatar.png
theme_color: "#0a0e0a"

# Build
markdown: kramdown
highlighter: rouge
permalink: /posts/:title/
excerpt_separator: "<!--more-->"

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

sass:
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Top navigation (rendered as a terminal command bar)
nav:
  - { name: "home",  url: "/",        icon: "~" }
  - { name: "posts", url: "/posts/",  icon: "$" }

# Apply the post layout to everything in _posts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .github
